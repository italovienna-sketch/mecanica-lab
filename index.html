      try {
        var s = JSON.parse(localStorage.getItem('mecanica_lab_settings_v1') || '{}');
        var t = s.theme === 'dark' || s.theme === 'light' ? s.theme : s.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
