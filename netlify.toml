[build]
  command = "npm run build"
  publish = "dist"

# Funções do servidor (área do instrutor). Variáveis de ambiente necessárias no painel da Netlify:
# INSTRUCTOR_ACCESS_CODE e, de preferência, INSTRUCTOR_TOKEN_SECRET.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/instructor/*"
  to = "/.netlify/functions/instructor/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/models/*.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"
    Cache-Control = "public, max-age=31536000, immutable"
